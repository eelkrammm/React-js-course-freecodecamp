<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Shopping Cart Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen  bg-gradient-to-r from-pink-200 via-purple-200 to-indigo-200">
  <div id="shopping-cart-container" class="flex flex-col lg:flex-row mx-auto max-w-3xl w-10/12 justify-center items-center mt-6">
  <h1 class="text-2xl font-bold mb-6">Shopping Cart Page</h1>
  <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 mt-5 flex lg:flex-row gap-5">
  <div class="card bg-gray-100 rounded-lg shadow-lg px-4 py-2 w-96 flex flex-col gap-2">
    <h2 class="font-bold text-xl">Americano</h2>
    <div class="flex justify-between items-center">
            <p class="quantity font-bold">Quantity:</p><span class="quantity">2</span>
        </div>
      
      <div class="flex justify-between items-center">
            <p class="quantity font-bold">Price:</p><span class="price">$10</span>
        </div>
    
    <p class="price"></p>
    <button class="remove-button bg-red-800 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-lg transition duration-200" >Remove</button>
  </div>
  <div class="card bg-gray-100 rounded-lg shadow-lg px-4 py-2 w-96 flex flex-col gap-2">
    <h2 class="font-bold text-xl">Latte</h2>
    <div class="flex justify-between items-center">
            <p class="quantity font-bold">Quantity:</p><span class="quantity">2</span>
        </div>
      
      <div class="flex justify-between items-center">
            <p class="quantity font-bold">Price:</p><span class="price">$10</span>
        </div>
    
    <button class="remove-button bg-red-800 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-lg transition duration-200" >Remove</button>
  </div>

  <div id="order-summary-container" class="bg-gray-100 rounded-lg shadow-lg px-4 py-2 w-96 flex flex-col gap-2 justify-center items-center border-2 border-gray-300">
  <h2 class="text-lg font-bold ">Order Summary</h2>
  <div class="flex justify-between items-center w-full">
    <p id="total" class="text-lg font-semibold">Total:</p>
    <span id="total-amount">$20</span>
  </div>
  <a href="#" class="w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-200">Checkout</a>
  </div>
  </div>
  
  
  </div>
  </body>
</html>
